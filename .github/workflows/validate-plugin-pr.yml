# Phase 4b: CI validation for community plugin PRs.
# Validates structure, security, and uniqueness on PR; auto-rebuilds
# marketplace.json and skills/index.json on merge to master.
# Modeled after wecoded-themes validate-theme.yml / update-registry.yml.
#
# LAYOUT ASSUMPTION (the reason this workflow was rewritten): plugins live
# at the REPO TOP LEVEL (wecoded-themes-plugin/, youcoded-inbox/, ...),
# each identified by containing a plugin.json (or .claude-plugin/plugin.json).
# There is no plugins/ folder — the original workflow filtered on
# 'plugins/**' and branch 'main', so it never fired even once.

name: Validate Plugin PR

on:
  pull_request:
    # WHY '**' + exclusions instead of a list of plugin dirs: GitHub path
    # filters can't express "any top-level dir containing plugin.json", and a
    # hardcoded dir list would silently skip the NEXT plugin someone adds.
    # So we fire on everything except the known non-plugin areas, and the
    # "Find changed plugin directories" step below does the precise
    # "does this top-level dir contain plugin.json?" check. A PR touching
    # only root files (README.md etc.) still triggers, finds no plugin
    # dirs, and passes in seconds — cheap and safe.
    # (marketplace.json and overrides/ stay INCLUDED on purpose: the enum
    # validation step checks them.)
    paths:
      - '**'
      - '!worker/**'
      - '!scripts/**'
      - '!docs/**'
      - '!skills/**'
      - '!themes/**'
      - '!integrations/**'
      - '!.github/**'
  push:
    branches: [master]  # the repo's default branch is master, not main
    paths:
      - '**'
      - '!worker/**'
      - '!scripts/**'
      - '!docs/**'
      - '!skills/**'
      - '!themes/**'
      - '!integrations/**'
      - '!.github/**'

jobs:
  # ── Validation (runs on PRs) ───────────────────────────────────────────────
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need the PR base commit for the diff below

      - name: Find changed plugin directories
        id: changed
        run: |
          # WHY cut -f1: plugins are TOP-LEVEL dirs (no plugins/ prefix), so
          # the first path segment is the plugin id. A changed top-level dir
          # counts as a plugin only if it contains plugin.json (all current
          # plugins) or .claude-plugin/plugin.json (the other Claude Code
          # convention, kept for future submissions). That check is what
          # keeps worker/, scripts/, root files, etc. out — and it detects
          # brand-new plugin dirs with no hardcoded list to maintain.
          CHANGED_TOP=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} \
            | cut -d'/' -f1 | sort -u)
          PLUGINS=""
          for d in $CHANGED_TOP; do
            if [ -f "$d/plugin.json" ] || [ -f "$d/.claude-plugin/plugin.json" ]; then
              PLUGINS="$PLUGINS $d"
            fi
          done
          PLUGINS="${PLUGINS# }"
          # Single line, space-separated — a multi-line value would corrupt GITHUB_OUTPUT
          echo "plugins=$PLUGINS" >> "$GITHUB_OUTPUT"
          echo "Found changed plugins: $PLUGINS"

      - name: Validate plugin.json exists with required fields
        env:
          PLUGINS: ${{ steps.changed.outputs.plugins }}
        run: |
          for id in $PLUGINS; do
            PLUGIN_DIR="$id"  # plugins are top-level dirs — the id IS the path
            if [ ! -d "$PLUGIN_DIR" ]; then
              echo "::error::Plugin directory '$PLUGIN_DIR' does not exist"
              exit 1
            fi

            # Check for plugin.json in either location
            PLUGIN_JSON=""
            if [ -f "$PLUGIN_DIR/.claude-plugin/plugin.json" ]; then
              PLUGIN_JSON="$PLUGIN_DIR/.claude-plugin/plugin.json"
            elif [ -f "$PLUGIN_DIR/plugin.json" ]; then
              PLUGIN_JSON="$PLUGIN_DIR/plugin.json"
            else
              echo "::error::Missing plugin.json for plugin '$id' (checked .claude-plugin/plugin.json and plugin.json)"
              exit 1
            fi

            # Validate JSON syntax and required fields — pass path via env, not shell interpolation
            export PLUGIN_JSON
            python3 -c "
          import json, sys, os
          pj = os.environ['PLUGIN_JSON']
          try:
              m = json.load(open(pj))
          except json.JSONDecodeError as e:
              print(f'::error::Invalid JSON in {pj}: {e}')
              sys.exit(1)

          required = ['name', 'description']
          missing = [f for f in required if f not in m or not m[f]]
          if missing:
              print(f'::error::{pj} missing required fields: {missing}')
              sys.exit(1)

          print(f'OK: {m[\"name\"]} — plugin.json valid')
          "
          done

      - name: Check for sensitive files
        env:
          PLUGINS: ${{ steps.changed.outputs.plugins }}
        run: |
          FOUND_SECRETS=0
          for id in $PLUGINS; do
            PLUGIN_DIR="$id"  # plugins are top-level dirs — the id IS the path

            # Check for .env files
            if find "$PLUGIN_DIR" -name '.env' -o -name '.env.*' | grep -q .; then
              echo "::error::Plugin '$id' contains .env files — remove before submitting"
              FOUND_SECRETS=1
            fi

            # Check for common secret file patterns
            if find "$PLUGIN_DIR" \
                -name 'credentials.json' -o \
                -name 'secrets.json' -o -name 'secrets.yaml' -o -name 'secrets.yml' -o \
                -name 'secret.json' -o -name 'secret.yaml' -o -name 'secret.yml' -o \
                -name '*.pem' -o -name '*.key' -o \
                -name 'tokens.json' -o -name 'token.json' -o -name 'token.txt' \
                | grep -q .; then
              echo "::error::Plugin '$id' contains files matching secret patterns"
              FOUND_SECRETS=1
            fi

            # Scan file contents for hardcoded API keys/tokens (common patterns).
            # WHY capture-then-test: `if grep | head` tests head's exit status
            # (always 0), which made this warning fire on EVERY plugin.
            MATCHES=$(grep -rl \
                -e 'sk-[a-zA-Z0-9]\{20,\}' \
                -e 'AKIA[A-Z0-9]\{16\}' \
                -e 'ghp_[a-zA-Z0-9]\{36\}' \
                -e 'gho_[a-zA-Z0-9]\{36\}' \
                "$PLUGIN_DIR" 2>/dev/null | head -3)
            if [ -n "$MATCHES" ]; then
              echo "$MATCHES"
              echo "::warning::Plugin '$id' may contain hardcoded API keys — please review"
            fi
          done

          if [ "$FOUND_SECRETS" -eq 1 ]; then
            exit 1
          fi
          echo "OK: No sensitive files detected"

      - name: Check total size
        env:
          PLUGINS: ${{ steps.changed.outputs.plugins }}
        run: |
          for id in $PLUGINS; do
            PLUGIN_DIR="$id"  # plugins are top-level dirs — the id IS the path
            SIZE=$(du -sb "$PLUGIN_DIR" | cut -f1)
            MAX=$((50 * 1024 * 1024))  # 50 MB
            if [ "$SIZE" -gt "$MAX" ]; then
              echo "::error::Plugin '$id' exceeds 50MB limit (${SIZE} bytes)"
              exit 1
            fi
            echo "OK: $id — ${SIZE} bytes (limit: ${MAX})"
          done

      - name: Validate enum fields (tags, lifeArea, audience)
        run: |
          # Validates any marketplace.json or overrides/*.json touched by this PR.
          # Fails fast on unknown enum values so authors get a clear signal.
          node -e "
          const fs = require('fs');
          const path = require('path');
          const { validateEnums } = require('./scripts/schema.js');

          function check(file, entries) {
            let fail = false;
            for (const e of entries) {
              const errors = validateEnums(e);
              if (errors.length) {
                fail = true;
                console.log('::error file=' + file + '::' + (e.id || e.name || '?') + ': ' + errors.join('; '));
              }
            }
            return fail;
          }

          let fail = false;
          if (fs.existsSync('marketplace.json')) {
            const mp = JSON.parse(fs.readFileSync('marketplace.json', 'utf8'));
            fail = check('marketplace.json', mp.plugins || []) || fail;
          }
          const overridesDir = 'overrides';
          if (fs.existsSync(overridesDir)) {
            for (const f of fs.readdirSync(overridesDir)) {
              if (!f.endsWith('.json')) continue;
              const p = path.join(overridesDir, f);
              const obj = JSON.parse(fs.readFileSync(p, 'utf8'));
              fail = check(p, [obj]) || fail;
            }
          }
          if (fail) process.exit(1);
          console.log('OK: all tags/lifeArea/audience values are in schema');
          "

      - name: Check plugin ID uniqueness
        env:
          PLUGINS: ${{ steps.changed.outputs.plugins }}
        run: |
          for id in $PLUGINS; do
            # Check against marketplace.json (YouCoded entries).
            # WHY the "same dir" allowance: plugins live at the repo top level,
            # so a PR that UPDATES an existing plugin (e.g. youcoded-inbox/)
            # matches an entry that is simply itself — only a registry entry
            # pointing somewhere ELSE under the same id is a real collision.
            export PLUGIN_ID="$id"
            if python3 -c "
          import json, sys, os
          pid = os.environ['PLUGIN_ID']
          try:
              data = json.load(open('marketplace.json'))
              for p in data.get('plugins', []):
                  if p.get('name', '').split(':')[0] != pid:
                      continue
                  src = p.get('source') or {}
                  same_dir = isinstance(src, dict) and src.get('source') == 'local' and src.get('path') == pid
                  if not same_dir:
                      print(f'::error::Plugin ID \"{pid}\" already exists in marketplace.json (different source)')
                      sys.exit(1)
          except FileNotFoundError:
              pass  # No marketplace.json yet — OK
          "; then
              echo "OK: '$id' has no conflicting entry in marketplace.json"
            else
              exit 1
            fi

            # Check against skills/index.json (includes Anthropic imports)
            # Fix: parse .entries from the wrapper object, not the root dict
            if python3 -c "
          import json, sys, os
          pid = os.environ['PLUGIN_ID']
          try:
              data = json.load(open('skills/index.json'))
              entries = data.get('entries', []) if isinstance(data, dict) else data
              entry = next((e for e in entries if e.get('id') == pid), None)
              if entry is not None:
                  # Allow community re-submissions, and allow the entry that IS
                  # this in-repo plugin (local source pointing at this same dir)
                  is_community = entry.get('sourceMarketplace') == 'community'
                  is_self = entry.get('sourceType') == 'local' and entry.get('sourceRef') == pid
                  if not (is_community or is_self):
                      print(f'::error::Plugin ID \"{pid}\" conflicts with existing entry in skills/index.json')
                      sys.exit(1)
          except FileNotFoundError:
              pass  # No index.json yet — OK
          "; then
              echo "OK: '$id' not conflicting in skills/index.json"
            else
              exit 1
            fi
          done

  # ── Bundled plugin version bump (runs on PRs) ──────────────────────────────
  bundled-version-bump:
    # WHY: the app upgrades bundled skills only when plugin.json's version rises.
    # A file change without a bump would ship to nobody who already has the skill.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Require a version bump when a bundled plugin's files change
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          FAIL=0
          for d in youcoded-chatsearch wecoded-themes-plugin wecoded-marketplace-publisher; do
            if git diff --quiet "$BASE" HEAD -- "$d/"; then continue; fi
            # WHY: when the plugin didn't exist at BASE, `git show` prints nothing and the
            # python3 parse of empty stdin throws — silence that expected-empty case so a
            # passing run's log doesn't show a traceback; `|| echo ""` still yields "".
            OLD=$(git show "$BASE:$d/plugin.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || echo "")
            NEW=$(python3 -c 'import json; print(json.load(open("'"$d"'/plugin.json")).get("version",""))')
            if [ "$OLD" = "$NEW" ]; then
              echo "::error file=$d/plugin.json::$d changed but its version is still '$NEW' — bump it so installed copies upgrade"
              FAIL=1
            else
              echo "$d: $OLD -> $NEW"
            fi
          done
          exit $FAIL
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run the chatsearch CLI tests when it changed
        if: always()
        run: |
          if git diff --quiet ${{ github.event.pull_request.base.sha }} HEAD -- youcoded-chatsearch/; then echo "unchanged"; exit 0; fi
          cd youcoded-chatsearch && npm test

  # ── Auto-rebuild on merge (runs on push to master) ─────────────────────────
  rebuild:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # Need previous commit to detect changes

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Find merged plugin directories
        id: merged
        run: |
          # WHY cut -f1 + plugin.json check: plugins are TOP-LEVEL dirs (no
          # plugins/ folder) — a merged top-level dir counts as a plugin only
          # if it contains plugin.json / .claude-plugin/plugin.json. This is
          # what keeps worker/, scripts/, root-file merges from triggering an
          # index rebuild, while new plugin dirs are detected automatically.
          CHANGED_TOP=$(git diff --name-only HEAD~1 HEAD \
            | cut -d'/' -f1 | sort -u)
          PLUGINS=""
          for d in $CHANGED_TOP; do
            if [ -f "$d/plugin.json" ] || [ -f "$d/.claude-plugin/plugin.json" ]; then
              PLUGINS="$PLUGINS $d"
            fi
          done
          PLUGINS="${PLUGINS# }"
          # Single line, space-separated — a multi-line value would corrupt GITHUB_OUTPUT
          echo "plugins=$PLUGINS" >> "$GITHUB_OUTPUT"
          echo "Merged plugins: $PLUGINS"

      # Every step below is skipped when the merge touched no plugin dir, so
      # docs/root-file merges never trigger a rebuild commit.
      - name: Auto-add entries to marketplace.json
        if: steps.merged.outputs.plugins != ''
        env:
          MERGED_PLUGINS: ${{ steps.merged.outputs.plugins }}
        run: |
          python3 -c "
          import json, os, sys

          mp_path = 'marketplace.json'
          data = json.load(open(mp_path))
          plugins = data.get('plugins', [])
          existing_names = {p.get('name', '').split(':')[0] for p in plugins}

          merged_ids = os.environ.get('MERGED_PLUGINS', '').split()
          added = 0

          for pid in merged_ids:
              if not pid.strip():
                  continue
              if pid in existing_names:
                  print(f'  SKIP: {pid} already in marketplace.json')
                  continue

              # Read plugin.json from the merged top-level directory
              pj_path = f'{pid}/.claude-plugin/plugin.json'
              if not os.path.exists(pj_path):
                  pj_path = f'{pid}/plugin.json'
              if not os.path.exists(pj_path):
                  print(f'  WARN: No plugin.json for {pid} — skipping')
                  continue

              pj = json.load(open(pj_path))

              # Build marketplace entry with sourceMarketplace: community
              entry = {
                  'name': pj.get('name', pid),
                  'description': pj.get('description', ''),
                  'author': {'name': pj.get('author', 'community')},
                  'category': pj.get('category', 'other'),
                  'source': {
                      'source': 'local',
                      # Top-level layout: the dir name IS the path (matches
                      # every existing local entry in marketplace.json)
                      'path': pid
                  },
                  'sourceMarketplace': 'community',
                  'displayName': pj.get('displayName', pj.get('name', pid))
              }
              plugins.append(entry)
              added += 1
              print(f'  ADD: {pid} -> marketplace.json (community)')

          if added > 0:
              data['plugins'] = plugins
              with open(mp_path, 'w') as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write('\n')
              print(f'Added {added} new plugin(s) to marketplace.json')
          else:
              print('No new plugins to add')
          "

      # Claude Code only loads <installLocation>/.claude-plugin/marketplace.json
      # — it does not fall back to the root copy. Regenerate the mirror after
      # auto-add so a CC-side re-clone of this repo yields a loadable marketplace.
      - name: Mirror marketplace.json to .claude-plugin/
        if: steps.merged.outputs.plugins != ''
        run: node scripts/mirror-cc-manifest.js

      - name: Rebuild skills/index.json
        if: steps.merged.outputs.plugins != ''
        env:
          # Use the built-in Actions token so the Tree API gets 5000/hr.
          # Public-repo scope is sufficient — we only read public trees.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync.js

      - name: Check extraction failure rate
        if: steps.merged.outputs.plugins != ''
        run: |
          # Sentinel for "something systemic broke". If >10% of non-deprecated
          # entries failed extraction, fail the build so it lands on Destin's
          # radar instead of silently shipping null components.
          node -e "
          const r = JSON.parse(require('fs').readFileSync('sync-report.json', 'utf8'));
          const failed = (r.components.failed || []).length + (r.components.truncated || []).length;
          const total = (r.components.extracted || 0) + failed;
          if (total === 0) { console.log('No extraction attempted — skipping threshold check'); process.exit(0); }
          const rate = failed / total;
          console.log('Extraction failure rate: ' + (rate * 100).toFixed(1) + '% (' + failed + '/' + total + ')');
          if (rate > 0.10) { console.log('::error::Extraction failure rate > 10%'); process.exit(1); }
          "

      - name: Commit updated marketplace files
        if: steps.merged.outputs.plugins != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketplace.json .claude-plugin/marketplace.json skills/index.json index.json sync-report.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-add community plugin(s) and rebuild index [skip ci]"
            git push
          fi

  # ── Apple Services validation ──────────────────────────────────────────────
  # apple-services/ also flows through the main validate job like any other
  # top-level plugin dir; these jobs add its extra checks (shellcheck,
  # AppleScript compile, binary sanity). They run on every PR but no-op
  # via the "touched" gate unless the PR actually changes apple-services/.
  validate-apple-services:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip if apple-services not touched
        id: touched
        run: |
          if git diff --name-only origin/master...HEAD | grep -q '^apple-services/'; then
            echo "touched=yes" >> "$GITHUB_OUTPUT"
          else
            echo "touched=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tools
        if: steps.touched.outputs.touched == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq

      - name: Shellcheck wrapper
        if: steps.touched.outputs.touched == 'yes'
        run: shellcheck apple-services/lib/apple-wrapper.sh

      - name: Validate plugin.json
        if: steps.touched.outputs.touched == 'yes'
        run: |
          jq -e '.name == "apple-services"' apple-services/plugin.json
          # [.] instead of \. — backslash-dot is an invalid jq string escape (compile error)
          jq -e '.version | test("^[0-9]+[.][0-9]+[.][0-9]+$")' apple-services/plugin.json
          jq -e '.platforms == ["macos"]' apple-services/plugin.json

      - name: Check binary SHA matches
        if: steps.touched.outputs.touched == 'yes'
        run: |
          if [ -f apple-services/bin/apple-helper ]; then
            EXPECTED=$(cat apple-services/bin/apple-helper.sha256)
            ACTUAL=$(sha256sum apple-services/bin/apple-helper | cut -d' ' -f1)
            [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::apple-helper SHA mismatch ($EXPECTED vs $ACTUAL)"; exit 1; }
          fi

  validate-apple-services-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip if apple-services not touched
        id: touched
        run: |
          if git diff --name-only origin/master...HEAD | grep -q '^apple-services/'; then
            echo "touched=yes" >> "$GITHUB_OUTPUT"
          else
            echo "touched=no" >> "$GITHUB_OUTPUT"
          fi

      - name: AppleScript + JXA syntax check
        if: steps.touched.outputs.touched == 'yes'
        run: |
          # WHY osacompile, not osascript: osascript EXECUTES the script —
          # mail/send.applescript raises by design with zero args, and anything
          # touching Mail/Notes dies on TCC permissions in CI. osacompile only
          # compiles, which is the actual syntax check we want.
          shopt -s nullglob  # empty glob -> loop skips instead of passing the literal pattern
          fail=0
          for f in apple-services/applescript/*/*.applescript; do
            if ! osacompile -o /dev/null "$f"; then
              echo "::error::$f failed AppleScript syntax check"
              fail=1
            fi
          done
          for f in apple-services/applescript/*/*.jxa; do
            if ! osacompile -l JavaScript -o /dev/null "$f"; then
              echo "::error::$f failed JXA syntax check"
              fail=1
            fi
          done
          exit $fail

      - name: Universal binary sanity
        if: steps.touched.outputs.touched == 'yes'
        run: |
          if [ -f apple-services/bin/apple-helper ]; then
            lipo -info apple-services/bin/apple-helper
            lipo -info apple-services/bin/apple-helper | grep -q 'arm64' || { echo "::error::missing arm64 slice"; exit 1; }
            lipo -info apple-services/bin/apple-helper | grep -q 'x86_64' || { echo "::error::missing x86_64 slice"; exit 1; }
          fi
