name = "wecoded-marketplace-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom domain (attached 2026-09-03). WHY: on the bare *.workers.dev address the
# Cache API is inert, so lib/rate-limit.ts — which keeps its counters there — never
# limited anything in production (measured 2026-08-28: 160 requests in ~2 s, zero
# 429s). On a zone-hosted domain the cache works and the limiter is live. The
# workers.dev address stays enabled so app versions that still name it keep working.
routes = [
  { pattern = "api.youcoded.ai", custom_domain = true }
]

[triggers]
crons = ["17 6 * * *"]   # daily maintenance: prune sessions/handles/device codes

[[d1_databases]]
binding = "DB"
database_name = "marketplace"
database_id = "e31c0476-df4e-45aa-960e-24410879aca8"
migrations_dir = "migrations"

[ai]
binding = "AI"

[[analytics_engine_datasets]]
binding = "APP_ANALYTICS"
dataset = "youcoded_app_events"

[durable_objects]
bindings = [
  { name = "PRESENCE", class_name = "PresenceRoom" },
  { name = "SYNC_HUB", class_name = "SyncGroupRoom" },
]

# DO class registration — required once per new class. SQLite-backed
# (new_sqlite_classes) works on both free and paid plans.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceRoom"]

# SyncHub per-account signal-relay DO (SyncHub §6).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["SyncGroupRoom"]

[vars]
# Set to the deploy timestamp of the device-id-keyed client (version N) once
# version N is the dominant client. Until then, leave empty — analytics
# queries will use a 1970 fallback so all post-deploy rows pass through.
CUTOVER_TIMESTAMP = ""
# Kill switch for GET /catalog. "0" makes it answer 503, which both apps already
# handle by falling back to index.json — the way to stop a bad ingest run from
# reaching every device without writing and deploying code under pressure.
CATALOG_ENABLED = "1"

# Where GET /catalog serves from: one pre-built object written at the end of an
# ingest run that changed something (src/catalog/publish.ts), instead of
# re-assembling ~5,000 D1 rows on every request.
#
# !! PLACEHOLDER IDS !! These MUST be replaced before this branch merges, or the
# deploy fails on an unknown namespace id. Run, in this directory:
#     npx wrangler kv namespace create CATALOG
#     npx wrangler kv namespace create CATALOG --preview
# and paste the two ids it prints below. Tests are unaffected either way —
# vitest-pool-workers/miniflare provisions a local KV by BINDING NAME and never
# looks at the id. (Namespaces created 2026-08-31 against Destinj101@gmail.com's
# account; `wrangler kv namespace list` is the source of truth if these ever drift.)
[[kv_namespaces]]
binding = "CATALOG_KV"
id = "a635a913ae8448bba50d63372afb13a1"
preview_id = "82814d7e798b4764b973d3775555ac19"

[env.test]
# WHY routes = []: environments inherit the top-level `routes`, and deploying
# env.test would otherwise REASSIGN api.youcoded.ai away from the production
# Worker (wrangler warns about exactly this on every test run). Tests never
# deploy, but an empty list makes the mistake impossible and silences the warning.
routes = []
# Test environment inherits config but omits AI binding — vitest-pool-workers /
# miniflare in this toolchain version can't resolve the wrapped AI worker.
[[env.test.d1_databases]]
binding = "DB"
database_name = "marketplace"
database_id = "e31c0476-df4e-45aa-960e-24410879aca8"
migrations_dir = "migrations"

# Env config is NOT inherited — the PRESENCE and SYNC_HUB DO bindings must be
# mirrored here so vitest-pool-workers/miniflare resolves them under the test
# environment. ([[migrations]] is NOT repeated — it's a top-level concept.)
[env.test.durable_objects]
bindings = [
  { name = "PRESENCE", class_name = "PresenceRoom" },
  { name = "SYNC_HUB", class_name = "SyncGroupRoom" },
]

# Env config is NOT inherited, so the catalog KV binding is mirrored here too —
# without it env.CATALOG_KV is undefined in tests and only the D1 fallback runs.
[[env.test.kv_namespaces]]
binding = "CATALOG_KV"
id = "a635a913ae8448bba50d63372afb13a1"
preview_id = "82814d7e798b4764b973d3775555ac19"

[env.test.vars]
GH_CLIENT_ID = "test"
GH_CLIENT_SECRET = "test"
# Bare GitHub numeric ids (comma-separated). Admin-ness is decided by matching
# the caller's github identity in `identities` — NOT the account id (spec §1).
ADMIN_USER_IDS = "424242"
CF_ACCOUNT_ID = "test-account"
CF_ANALYTICS_TOKEN = "test-token"
# Non-empty defaults so admin-analytics tests can verify cutover + filter
# clauses are interpolated. Mutating env at test runtime does NOT propagate
# to the worker (cloudflare:test snapshots env at start), so values that
# need to flow into c.env must come from [env.test.vars].
CUTOVER_TIMESTAMP = "2026-05-15T00:00:00Z"
KNOWN_DEV_DEVICES = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
# Presence staleness threshold override so eviction is reachable inside a test
# run — production uses the generous in-code default (see presence-room.ts).
PRESENCE_STALE_MS = "800"
# Head-to-head attestation window override, same reason as PRESENCE_STALE_MS:
# the 2-minute production default is unreachable in a test run.
GAME_RESULT_TIMEOUT_MS = "600"
# The ingest gate's secret, fixed for tests (production gets it from CI as a
# wrangler secret). CATALOG_ENABLED mirrors the top-level var so the kill switch
# is off in tests.
CATALOG_INGEST_TOKEN = "test-ingest-token"
CATALOG_ENABLED = "1"

# Production runtime config: GH_CLIENT_ID, GH_CLIENT_SECRET, and ADMIN_USER_IDS
# are injected as secrets by CI (see .github/workflows/worker-deploy.yml).
# Do NOT add them as [vars] here — a var with the same name as a secret wins
# on deploy and silently clobbers the secret, breaking OAuth in prod.

[observability]
enabled = true
